services:
  web:
    image: boben19/django-app:latest
    working_dir: /app/projectsite
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - django_data:/app
    env_file:
      - path: .env
        required: false
    environment:
      - DEBUG=1
      - USE_SQLITE=true
      - DJANGO_ALLOWED_HOSTS=localhost 127.0.0.1 [::1]

volumes:
  django_data:
